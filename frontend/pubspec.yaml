name: whosenearby
description: WhoseNearby — modern artisan marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: 2.2.3
  web_socket_channel: ^3.0.1
  geolocator: 11.1.0
  geocoding: 3.0.0
  flutter_local_notifications: 17.2.4
  image_picker: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_full.png